<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearts2Hearts Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f7f6f4;--ink:#1c1c1c;--sub:#777;--line:#e6e4e1;--accent:#ff4d6d;--btn:#1c1c1c;--btnink:#fff;--sel:#f3efe9}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--surface:#202020;--ink:#f1f1f1;--sub:#9a9a9a;--line:#333;--btn:#f1f1f1;--btnink:#161616;--sel:#262320;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a,a:hover,a:focus,a:visited,u,ins,abbr{text-decoration:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 "Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:44px 28px 72px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;justify-content:space-between}
.site{font:700 40px/1.1 Barlow,"Noto Sans KR",sans-serif;margin:0 0 30px;letter-spacing:-.02em}
.site span{font-weight:500}
.mo{font:700 30px/1 Barlow,"Noto Sans KR",sans-serif;margin:0;letter-spacing:-.02em}
.tb{display:flex;align-items:center;flex-wrap:wrap;gap:8px 22px}
.lead{color:var(--sub);font-size:13px;line-height:1.7;margin:22px 0 0;max-width:420px}
.nav{display:flex;align-items:center;gap:2px;position:relative;top:1.5px}
.nav button{border:0;background:none;width:30px;height:30px;padding:0;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav .tdot:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
@media(hover:hover){.nav button:hover{background:var(--surface)}}
.nav .today{width:auto;padding:0 8px;margin-left:10px;font-size:13px;border-radius:0;color:var(--sub)}
.nav .today:hover{background:none;color:var(--ink)}
.btn{background:var(--btn);color:var(--btnink);border:0;padding:12px 22px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.16);border-radius:3px}
.btn.ghost{background:none;color:var(--ink);box-shadow:none;border:1px solid var(--line);padding:8px 14px;font-weight:500}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;margin-top:56px}
.dow,.week{--g:12px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0 var(--g)}
.dow div{font:600 12px Barlow,sans-serif;color:var(--sub);padding-bottom:16px;letter-spacing:.04em}
.dow .sun,.num.sun{color:var(--accent)}
.cell{border:0;border-top:2px solid var(--ink);background:none;text-align:left;padding:9px 0 0;height:170px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
.cell>*{flex:none}
@media(hover:hover){.cell:hover{background:var(--surface)}}
.cell.out{border-top-color:var(--line)}
.cell.out .num{color:var(--sub);opacity:.75}
.cell.sel{border-top-color:var(--accent)}
.cell.sel .num{color:var(--accent)}
.cell.today{border-top-color:var(--accent)}
.cell.today .num{color:var(--accent)}
.num{font:500 26px/1 Barlow,sans-serif;display:block;margin-bottom:4px}
.ev{display:flex;gap:6px;margin-top:9px;font-size:12px;line-height:1.35;text-align:left}
.ev:before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--ink);margin-top:.55em}
.evb{min-width:0;flex:1}
.evb b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.evb i{display:block;font-style:normal;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item .t:before,.ub .t:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink);margin-right:5px;vertical-align:middle;position:relative;top:-1px}
.item.nodot .t:before,.ub .t:before{display:none}
.dots{display:none}
.more{font-size:11px;color:var(--sub);margin-top:8px;display:block}
aside{border-left:1px solid var(--line);padding-left:28px;min-width:0}
aside h2{font:700 22px Barlow,"Noto Sans KR",sans-serif;margin:0 0 4px}
aside .d{color:var(--sub);margin-bottom:16px}
.item{border-bottom:1px solid var(--line);padding:12px 0}
.item{position:relative}
.item.edit{cursor:pointer;padding-right:52px}
.editbtn{position:absolute;right:0;top:12px;border:0;background:none;padding:0;font-size:12px;color:var(--sub);cursor:pointer}
.editbtn:hover{color:var(--ink);border-color:var(--ink)}
.item .t{font-weight:700;display:block}
.item .m{color:var(--sub);font-size:12px}
.memo{white-space:pre-line;overflow-wrap:anywhere}
.memo a{color:var(--accent);text-decoration:none}
.empty{color:var(--sub);padding:12px 0}
.sec{font-weight:700;margin:24px 0 4px}
dialog{border:0;border-radius:6px;padding:0;width:min(440px,calc(100% - 24px));background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
form{padding:24px;display:grid;gap:14px}
form h3{margin:0;font:700 20px Barlow,"Noto Sans KR",sans-serif}
label,.fld{display:grid;gap:4px;font-size:12px;color:var(--sub)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);padding:9px 10px;border-radius:3px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:2px 16px}
.chip{border:0;background:none;border-radius:0;padding:5px 0;cursor:pointer;font-size:14px;color:var(--sub)}
.chip[aria-pressed="true"]{color:var(--accent);font-weight:700}
.lnks{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:6px 16px}
.lnk{border:0;background:none;padding:0;font-size:12px;color:var(--sub);cursor:pointer}
.lnk:hover{color:var(--ink)}
#up{display:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.acts .del{margin-right:auto;color:var(--accent);border-color:var(--accent)}
.foot{margin-top:64px;color:var(--sub);font-size:12px;display:flex;gap:12px;align-items:center}
#count:empty{display:none}
.foot button{border:0;background:none;color:var(--sub);cursor:pointer;padding:0;font-size:12px}
@media(max-width:900px){
.layout{grid-template-columns:1fr;margin-top:28px}
.layout{gap:18px}
aside{border-left:0;padding-left:0;border-top:0;padding-top:0}
aside h2{font-size:18px}
aside .d{font-size:12px;margin-bottom:10px}
aside .empty{font-size:13px}
aside.nosel,aside .act-clear{display:none}
#up{display:block;margin-top:32px;padding:0 0 18px;border-bottom:1px solid var(--line)}
.uhead{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.uhead:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.urow{display:flex;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line);cursor:pointer}
.uhead+.urow{border-top:0}
.ud{flex:none;width:44px;text-align:left;line-height:1.1}
.ud b{display:block;font:700 15px Barlow,sans-serif}
.ud i{display:block;font-style:normal;font-size:10px;color:var(--accent);margin-top:2px}
.ub{min-width:0;flex:1}
.ub .t,.ub .m{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub .t{font-weight:700;font-size:13px}
.ub .m{color:var(--sub);font-size:11px}
.urow .editbtn{position:static;flex:none}
#up .empty{padding:6px 0 12px;font-size:13px}
}
@media(max-width:640px){.wrap{padding:32px 18px 56px}.site{font-size:28px;margin-bottom:22px}.mo{font-size:24px}.nav{top:1.2px}.lead{margin-top:18px}.dow,.week{--g:0px}
.dow div{text-align:center;padding-bottom:10px}
.cell,.cell.out,.cell.today,.cell.sel{border-top:1px solid var(--line)}
.cell{height:120px;padding:10px 2px 0;align-items:stretch;text-align:left}
.cell:hover{background:none}
.num{font-size:15px;line-height:28px;height:28px;margin:0 auto 3px;text-align:center}
.cell.sel .num{font-weight:700}
.ev{font-size:10px;gap:3px;margin-top:4px;line-height:1.3}
.ev:before{width:4px;height:4px;margin-top:.45em}
.evb i{display:none}
.evb b{-webkit-line-clamp:2}
.more{font-size:10px;margin-top:4px;text-align:center}
.cell.out .ev,.cell.out .more{opacity:.5}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 class="site">Hearts2Hearts <span>Schedule</span></h1>
    <div class="tb"><h2 id="title" class="mo"></h2><div class="nav"><button id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button class="tdot" id="goToday" aria-label="오늘" title="오늘"></button><button id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div></div>
    <p class="lead">하츠투하츠의 모든 일정을 한곳에서 모아봐요.<br>날짜를 누르면 그날의 일정을 볼 수 있어요.</p>
  </div>
</header>
<section id="up" aria-label="다가오는 일정"></section>
<div class="layout">
  <main><div class="dow" id="dow"></div><div id="grid"></div></main>
  <aside id="side"></aside>
</div>
<div class="foot"><span id="count"></span><button id="add" hidden>일정 등록</button><button id="auth">관리자</button></div>
</div>

<dialog id="dlg">
<form id="f" method="dialog">
  <h3 id="ft">일정 등록</h3>
  <label>제목<input id="fTitle" required maxlength="120"></label>
  <label>날짜<input id="fDate" type="date" required></label>
  <label>종류<select id="fType"></select></label>
  <div class="fld"><span>멤버 (선택하지 않으면 전체)</span><div class="chips" id="fMem"></div></div>
  <label>메모 (선택)<textarea id="fMemo" rows="3"></textarea></label>
  <div class="acts">
    <button type="button" class="btn ghost del" id="fDel">삭제</button>
    <button type="button" class="btn ghost" id="fCancel">취소</button>
    <button type="submit" class="btn" id="fSave">저장</button>
  </div>
</form>
</dialog>

<script>
/* ▼ 본인 저장소 정보로 바꾸세요 ▼ */
const CFG={owner:"H2H-schedule",repo:"schedule",branch:"main",path:"schedule.json"};
/* ▲ ▲ ▲ */

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=t=>esc(t).replace(/https?:\/\/[^\s<]+/g,u=>{const m=u.match(/[.,;:!?)\]]+$/),tail=m?m[0]:'',url=tail?u.slice(0,-tail.length):u;return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`});
const DOW=['월','화','수','목','금','토','일'];
const TK='h2h-gh-token';
const getTok=()=>{try{return localStorage.getItem(TK)||''}catch(e){return''}};
const TYPES=['방송','라디오','콘텐츠','공연·행사','팬사인회','영상통화회','음반·발매','이벤트','잡지','기념일','기타'];
const MEMBERS=['카르멘','지우','유하','스텔라','주은','에이나','이안','예온'];
function toList(j){
  return (Array.isArray(j)?j:[]).filter(x=>x&&x.title&&x.date).map((x,i)=>({id:x.id||'a'+i,date:x.date,title:x.title,type:x.type||'기타',members:x.members||[],memo:x.memo||''}));
}
let data={},events=[],view=new Date(),sel=null,editing=null,status='';
view.setDate(1);

function build(){events=toList(data)}
const isAdmin=()=>!!getTok();

function render(){
  $('title').textContent=view.getFullYear()+'.'+pad(view.getMonth()+1);
  $('dow').innerHTML=DOW.map((d,i)=>`<div class="${i==6?'sun':''}">${d}</div>`).join('');
  const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7;
  const weeks=Math.ceil((off+new Date(y,m+1,0).getDate())/7),start=new Date(first);start.setDate(1-off);
  const by={};events.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  const today=ymd(new Date());let html='';
  for(let w=0;w<weeks;w++){
    let row='';
    for(let i=0;i<7;i++){
      const d=new Date(start);d.setDate(start.getDate()+w*7+i);
      const s=ymd(d),out=d.getMonth()!==m,list=by[s]||[],cap=2;
      const shown=list.slice(0,cap).map(e=>{const meta=[e.type,e.members.length?e.members.join(', '):''].filter(Boolean).join(' · ');return `<span class="ev" title="${esc(e.title)}"><span class="evb"><b>${esc(e.title)}</b><i>${esc(meta)}</i></span></span>`}).join('');
      const more=list.length>cap?`<span class="more">외 ${list.length-cap}개</span>`:'';
      row+=`<button class="cell${out?' out':''}${s===today?' today':''}${s===sel?' sel':''}" data-d="${s}" aria-label="${s} 일정 ${list.length}개"><span class="num${i==6?' sun':''}">${pad(d.getDate())}</span><span class="dots">${list.slice(0,3).map(()=>"<i></i>").join("")}</span>${shown}${more}</button>`;
    }
    html+=`<div class="week">${row}</div>`;
  }
  $('grid').innerHTML=html;
  $('count').textContent=status;
  $('add').hidden=!isAdmin();
  $('auth').textContent=isAdmin()?'관리자 모드 끄기':'관리자';
  side();renderUp();$('side').classList.toggle('nosel',!sel);
}
function renderUp(){
  const t=ymd(new Date()),up=events.slice().sort((a,b)=>a.date.localeCompare(b.date)).filter(e=>e.date>=t).slice(0,3);
  $('up').innerHTML='<div class="uhead">다가오는 일정</div>'+(up.length?up.map(e=>{
    const d=new Date(e.date+'T00:00'),meta=[e.type,e.members.length?e.members.join(', '):''].filter(Boolean).join(' · ');
    return `<div class="urow" data-d="${e.date}" data-id="${esc(e.id)}"><div class="ud"><b>${pad(d.getMonth()+1)}.${pad(d.getDate())}</b><i>${DOW[(d.getDay()+6)%7]}</i></div><div class="ub"><span class="t">${esc(e.title)}</span><span class="m">${esc(meta)}</span></div></div>`;
  }).join(''):'<div class="empty">다가오는 일정이 없어요.</div>');
}
function itemHtml(e,showDate,noEdit){
  const meta=[showDate?e.date:'',e.type,e.members.length?e.members.join(', '):''].filter(Boolean).join(' · ');
  return `<div class="item${isAdmin()&&!noEdit?' edit':''}${noEdit?' nodot':''}" data-id="${esc(e.id)}">${isAdmin()&&!noEdit?'<button type="button" class="editbtn">수정</button>':''}<span class="t">${esc(e.title)}</span><span class="m">${esc(meta)}</span>${e.memo?`<div class="m memo">${linkify(e.memo)}</div>`:''}</div>`;
}
function side(){
  const evs=events.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(sel){
    const list=evs.filter(e=>e.date===sel),d=new Date(sel+'T00:00');
    $('side').innerHTML=`<h2>${d.getMonth()+1}월 ${d.getDate()}일</h2><div class="d">${DOW[(d.getDay()+6)%7]}요일</div>`+(list.length?list.map(e=>itemHtml(e)).join(''):'<div class="empty">이 날은 등록된 일정이 없어요.</div>')+'<p class="lnks">'+(isAdmin()?'<button class="lnk act-add">이 날짜에 일정 등록</button>':'')+'<button class="lnk act-clear">다가오는 일정 보기</button></p>';
  }else{
    const t=ymd(new Date()),up=evs.filter(e=>e.date>=t).slice(0,5);
    $('side').innerHTML='<h2>다가오는 일정</h2><div class="d">오늘 이후 등록된 일정</div>'+(up.length?up.map(e=>itemHtml(e,1,1)).join(''):'<div class="empty">다가오는 일정이 없어요.</div>');
  }
}

/* GitHub에 schedule.json 커밋 */
async function commit(mut,msg){
  const api=`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
  const h={Authorization:'Bearer '+getTok(),Accept:'application/vnd.github+json'};
  for(let n=0;n<3;n++){
    /* GitHub API 응답은 브라우저에 캐시되어 sha가 오래된 값일 수 있어서 항상 새로 받아요 */
    const r=await fetch(api+'?ref='+CFG.branch+'&t='+Date.now(),{headers:h,cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const cur=toList(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)))));
    mut(cur);
    const sorted=cur.sort((a,b)=>a.date.localeCompare(b.date));
    const bytes=new TextEncoder().encode(JSON.stringify(sorted,null,2));let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
    const p=await fetch(api,{method:'PUT',headers:h,cache:'no-store',body:JSON.stringify({message:msg,content:btoa(bin),sha:j.sha,branch:CFG.branch})});
    if(p.status===409&&n<2)continue; /* 그 사이 파일이 바뀐 경우 최신본으로 다시 시도 */
    if(!p.ok)throw new Error(p.status);
    data=sorted;build();render();
    return;
  }
}
const removeId=(a,id)=>{const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1)};

function openForm(ev,date){
  editing=ev||null;
  $('ft').textContent=ev?'일정 수정':'일정 등록';
  $('fTitle').value=ev?ev.title:'';
  $('fDate').value=ev?ev.date:(date||sel||ymd(new Date()));
  $('fType').innerHTML=TYPES.map(t=>`<option>${t}</option>`).join('');
  $('fType').value=ev?ev.type:'방송';
  $('fMemo').value=ev?ev.memo:'';
  const ms=new Set(ev?ev.members:[]);
  $('fMem').innerHTML=MEMBERS.map(m=>`<button type="button" class="chip" data-m="${m}" aria-pressed="${ms.has(m)}">${m}</button>`).join('');
  $('fDel').style.display=ev?'':'none';
  $('dlg').showModal();
}
const mob=()=>matchMedia('(max-width:900px)').matches;
const showSide=()=>{if(mob()&&sel)$('side').scrollIntoView({behavior:'smooth',block:'nearest'})};
$('grid').onclick=e=>{const c=e.target.closest('[data-d]');if(!c)return;const s=c.dataset.d;if(mob()&&sel===s){sel=null;return render()}sel=s;const d=new Date(sel+'T00:00');if(d.getMonth()!==view.getMonth())view=new Date(d.getFullYear(),d.getMonth(),1);render();showSide()};
$('up').onclick=e=>{
  const r=e.target.closest('.urow');if(!r)return;
  sel=r.dataset.d;const d=new Date(sel+'T00:00');view=new Date(d.getFullYear(),d.getMonth(),1);render();showSide();
};
$('side').onclick=e=>{
  if(e.target.closest('.act-add'))return openForm(null,sel);
  if(e.target.closest('.act-clear')){sel=null;return render()}
  if(e.target.closest('a'))return;
  const it=e.target.closest('.item.edit');
  if(it){const x=events.find(v=>v.id===it.dataset.id);if(x)openForm(x)}
};
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$('goToday').onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);sel=ymd(n);render()};
$('add').onclick=()=>openForm(null);
$('fCancel').onclick=()=>$('dlg').close();
$('fMem').onclick=e=>{const b=e.target.closest('[data-m]');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
$('fDel').onclick=async()=>{
  if(!confirm('이 일정을 삭제할까요?'))return;
  try{await commit(o=>removeId(o,editing.id),'일정 삭제');$('dlg').close()}catch(err){alert('삭제하지 못했어요. 토큰과 저장소 설정을 확인해 주세요. ('+err.message+')')}
};
$('f').onsubmit=async e=>{
  e.preventDefault();
  const t=$('fTitle').value.trim(),d=$('fDate').value;if(!t||!d)return;
  const btn=$('fSave');btn.disabled=true;
  try{
    const rec={id:editing?editing.id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:d,title:t,type:$('fType').value,members:[...document.querySelectorAll('#fMem [aria-pressed="true"]')].map(b=>b.dataset.m),memo:$('fMemo').value.trim()};
    await commit(o=>{removeId(o,rec.id);o.push(rec)},editing?'일정 수정':'일정 추가');
    $('dlg').close();sel=d;const x=new Date(d+'T00:00');view=new Date(x.getFullYear(),x.getMonth(),1);render();
  }catch(err){alert('저장하지 못했어요. 토큰과 저장소 설정을 확인해 주세요. ('+err.message+')')}
  btn.disabled=false;
};
$('auth').onclick=()=>{
  try{
    if(isAdmin()){localStorage.removeItem(TK)}
    else{const t=prompt('GitHub 토큰을 입력하세요. 이 브라우저에만 저장돼요.');if(t)localStorage.setItem(TK,t.trim())}
  }catch(err){}
  render();
};

fetch(CFG.path+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{data=j;build();render()}).catch(()=>{status='일정을 불러오지 못했어요.';render()});
render();
</script>
</body>
</html>
